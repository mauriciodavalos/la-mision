<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="La Misión">
  <!--
    Marca simplificada para tamaños chicos (pestaña, marcador, 16-48 px).

    NO es el arte completo de diseño/IconoLaMision.png: ese lleva rejilla de
    radar, anillos punteados y el texto "LA MISIÓN", y a 16 px todo eso colapsa
    en un disco oscuro con una mancha naranja. Aquí quedan solo los cuatro
    elementos que sobreviven al tamaño —el disco azul, el arco naranja, la rosa
    de los vientos y el pin—, dibujados vectoriales para que no se vean sucios
    en ninguna pantalla.

    Lo que manda la composición es lo que se lee a 16 px: el lente del centro con
    su anillo naranja. Por eso es grande y la estrella se queda corta y delgada,
    al revés de lo que pediría el arte grande. El arte completo se sigue usando
    donde el tamaño lo aguanta: icono-192, icono-512, el maskable y el
    apple-touch-icon.
  -->
  <defs>
    <radialGradient id="fondo" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#27506B"/>
      <stop offset="62%" stop-color="#1C394C"/>
      <stop offset="100%" stop-color="#0B1822"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="30.4" fill="url(#fondo)" stroke="#F2F5F7" stroke-width="2.2"/>

  <!-- Arco naranja sobre la parte alta, como en el original -->
  <path d="M12.6 22.2 A 24 24 0 0 1 51.4 22.2" fill="none" stroke="#E8622A"
        stroke-width="2.4" stroke-linecap="round"/>

  <!-- Rosa de los vientos: corta y delgada, para no competir con el lente -->
  <path d="M32 8.5 L34.2 29.8 L55.5 32 L34.2 34.2 L32 55.5 L29.8 34.2 L8.5 32 L29.8 29.8 Z"
        fill="#E7ECEF"/>
  <path d="M32 8.5 L34.2 29.8 L32 32 L29.8 29.8 Z" fill="#E8622A"/>

  <!-- Lente al centro: es lo que identifica la marca cuando todo lo demás se pierde -->
  <circle cx="32" cy="32" r="11" fill="#2C5E80" stroke="#E8622A" stroke-width="2.8"/>
  <circle cx="32" cy="32" r="4.6" fill="#0B1822"/>

  <!-- Pin de ubicación, replegado a la esquina para no encimarse con el arco -->
  <path d="M47.5 26.4 c-3.7-5.4-5.3-7.3-5.3-9.6 a5.3 5.3 0 1 1 10.6 0 c0 2.3-1.6 4.2-5.3 9.6 z"
        fill="#E8622A" stroke="#0B1822" stroke-width="1.1" stroke-linejoin="round"/>
  <circle cx="47.5" cy="16.9" r="1.9" fill="#FFFFFF"/>
</svg>
